<div class="jf-wrap">
  <div class="jf-topbar">
    <div class="jf-title-group">
      <span class="jf-title-icon"><i class="fa-solid fa-rocket"></i></span>
      <h2 class="jf-title">직지 프로젝트 SF</h2>
      <span class="jf-count" id="jf-count">(불러오는 중…)</span>
    </div>
    <div class="jf-topbar-right">
      <button class="jf-pill-btn" id="jf-sort-btn" title="정렬 방식 전환">
        <i class="fa-solid fa-arrow-down-a-z"></i>
        <span id="jf-sort-label">번호순</span>
      </button>
      <button class="jf-pill-btn" id="jf-refresh-btn" title="새로고침">
        <i class="fa-solid fa-rotate"></i>
      </button>
    </div>
  </div>

  <div class="jf-searchbar">
    <i class="fa-solid fa-magnifying-glass jf-search-icon"></i>
    <input
      type="text"
      id="jf-search-input"
      class="jf-search-input"
      placeholder="제목 · 저자명 검색 (단축키: Alt + `)"
      autocomplete="off"
    />
    <button class="jf-search-btn" id="jf-search-btn">검색</button>
  </div>

  <div class="jf-status" id="jf-status">불러오는 중...</div>

  <div class="jf-grid" id="jf-grid"></div>
</div>
